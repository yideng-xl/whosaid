[project]
name = "transcribe-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.51.0",
    "websockets==16.1",
    "mlx-whisper==0.4.3",
    "pyannote.audio==4.0.7",
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "huggingface-hub==1.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: 需要真实模型/音频的集成测试"]
filterwarnings = [
    # 第三方告警：starlette TestClient 提示 httpx 已弃用（非本代码问题）。
    # 按类路径精确过滤，避免一刀切掩盖其他弃用告警。
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
